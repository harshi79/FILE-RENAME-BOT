# Render Blueprint for the Telegram File Renamer Bot.
# Deploys as a Web Service so Render provides an HTTPS URL and can health-check
# the process on the free tier. PostgreSQL + Key Value (Redis) are provisioned
# automatically.
services:
  - type: web
    name: file-renamer-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      # DATABASE_URL must use the Render Postgres INTERNAL connection URL.
      # `fromDatabase` + `connectionString` injects the internal URL used on
      # Render's private network (not the public endpoint), and keeps the URL
      # out of Git so it is never hardcoded. Both services live in this same
      # Blueprint, so Render provisions them in the same workspace & region.
      - key: DATABASE_URL
        fromDatabase:
          name: file-renamer-db
          property: connectionString
      # REDIS_URL must use the Render Key Value INTERNAL connection URL.
      # `fromService` (type: kv) + `connectionString` injects the private,
      # internal connection string used inside the Render private network.
      # Do NOT use the public/external Key Value URL from the web service
      # dashboard when the internal URL is available. Never hardcode it.
      - key: REDIS_URL
        fromService:
          type: kv
          name: file-renamer-redis
          property: connectionString
      - key: MAX_FILE_SIZE_MB
        value: "25"
      - key: MAX_GLOBAL_ACTIVE_JOBS
        value: "2"
      - key: MAX_ACTIVE_JOBS_PER_USER
        value: "1"
      - key: MAX_RETRIES
        value: "3"
      - key: JOB_TIMEOUT
        value: "300"
      # Render injects $PORT automatically; the health server binds to it.
      - key: HEALTH_HOST
        value: "0.0.0.0"
      # Optional start video (Telegram file_id or public URL).
      - key: START_VIDEO_URL
        sync: false

  - type: kv
    name: file-renamer-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: file-renamer-db
    plan: free
    databaseName: filerenamer
    user: filerenamer
